<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932">
 <rect width="430" height="932" rx="42" fill="#101816"/><rect x="9" y="9" width="412" height="914" rx="35" fill="#f5f5ef"/>
 <rect x="9" y="9" width="412" height="35" rx="35" fill="#172421"/><text x="30" y="32" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">9:41</text><text x="346" y="32" fill="#fff" font-family="Arial,sans-serif" font-size="13">●  ▮▮  ▰</text>
 <path d="M9 44h412v76H9z" fill="#172421"/><text x="30" y="77" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Idea al volo</text><text x="30" y="101" fill="#c6d5cf" font-family="Arial,sans-serif" font-size="13">Parla, salva l’idea e ritrova le cose da fare.</text>
 <rect x="25" y="136" width="380" height="520" rx="20" fill="#fff" stroke="#e0e5df"/><rect x="43" y="153" width="344" height="56" rx="13" fill="#176b55"/><text x="215" y="188" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">🎙  Tocca e parla</text>
 <text x="43" y="235" fill="#66736e" font-family="Arial,sans-serif" font-size="13">La registrazione rimane su questo dispositivo.</text>
 <text x="43" y="273" fill="#66736e" font-family="Arial,sans-serif" font-size="12" font-weight="700">TRASCRIZIONE O NOTA</text><rect x="43" y="284" width="344" height="105" rx="12" fill="#fff" stroke="#e0e5df"/><text x="57" y="309" fill="#8a9690" font-family="Arial,sans-serif" font-size="13"><tspan x="57" dy="0">Parla oppure scrivi qui. Esempio:</tspan><tspan x="57" dy="20">“Oggi ricordami di chiamare il</tspan><tspan x="57" dy="20">commercialista, passare in banca…”</tspan></text>
 <text x="43" y="421" fill="#66736e" font-family="Arial,sans-serif" font-size="12" font-weight="700">FOTO DELL’ARTICOLO (FACOLTATIVA)</text><rect x="43" y="433" width="344" height="48" rx="11" fill="#eaf3ee" stroke="#b8d5c7"/><text x="60" y="463" fill="#172421" font-family="Arial,sans-serif" font-size="14">▧  Scatta una foto o scegli un’immagine</text>
 <rect x="43" y="498" width="218" height="45" rx="10" fill="#fff" stroke="#e0e5df"/><text x="57" y="526" fill="#8a9690" font-family="Arial,sans-serif" font-size="13">Titolo (facoltativo)</text><rect x="270" y="498" width="117" height="45" rx="11" fill="#176b55"/><text x="328" y="526" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Salva idea</text>
 <rect x="43" y="559" width="161" height="39" rx="11" fill="#eaf3ee"/><text x="123" y="584" fill="#172421" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">☑  Cosa devo fare oggi?</text><rect x="214" y="559" width="173" height="39" rx="11" fill="#eaf3ee"/><text x="300" y="584" fill="#172421" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">🔊  Leggi attività aperte</text>
 <text x="43" y="624" fill="#66736e" font-family="Arial,sans-serif" font-size="11">Memo ti chiede cosa fare con la foto e salva tutto nella nota.</text>
 <rect x="25" y="674" width="380" height="220" rx="20" fill="#fff" stroke="#e0e5df"/><text x="45" y="710" fill="#172421" font-family="Arial,sans-serif" font-size="18" font-weight="700">💬  Parla con Memo</text><text x="45" y="735" fill="#66736e" font-family="Arial,sans-serif" font-size="12">Puoi chiamarla anche “Marta”.</text><rect x="45" y="753" width="165" height="46" rx="12" fill="#176b55"/><text x="127" y="782" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">🎙  Chiedi a Marta</text><rect x="45" y="812" width="335" height="40" rx="10" fill="#fff" stroke="#e0e5df"/><text x="59" y="837" fill="#8a9690" font-family="Arial,sans-serif" font-size="13">Marta, cosa dobbiamo fare oggi?</text>
 <rect x="9" y="871" width="412" height="52" rx="30" fill="#f5f5ef"/><rect x="169" y="891" width="92" height="5" rx="3" fill="#172421"/>
</svg>
