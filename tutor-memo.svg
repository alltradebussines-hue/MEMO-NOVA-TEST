<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" role="img" aria-labelledby="title desc"><title id="title">Nova, assistente di Memo Nova</title><desc id="desc">Un piccolo assistente sorridente ascolta con un megafono e scrive con una penna.</desc><style>.nova{transform-origin:90px 112px;animation:bob 3s ease-in-out infinite}.horn{transform-origin:54px 76px;animation:listen 2.8s ease-in-out infinite}.pen{transform-origin:130px 91px;animation:write 2.8s ease-in-out infinite}.sound{animation:sound 1.4s ease-out infinite;transform-origin:31px 65px}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes listen{0%,40%,100%{transform:rotate(-3deg)}18%{transform:rotate(-12deg)}}@keyframes write{0%,45%,100%{transform:rotate(4deg)}68%{transform:rotate(-8deg)}}@keyframes sound{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}</style><rect width="180" height="150" rx="24" fill="#eaf3ee"/><g class="nova"><ellipse cx="90" cy="129" rx="42" ry="7" fill="#d6e5dc"/><path d="M55 106c2-23 14-34 35-34s33 11 35 34v10H55Z" fill="#176b55"/><path d="M70 111v13m40-13v13" stroke="#172421" stroke-width="8" stroke-linecap="round"/><rect x="59" y="32" width="62" height="56" rx="24" fill="#fff" stroke="#172421" stroke-width="4"/><path d="M75 58v1m30-1v1" stroke="#172421" stroke-width="7" stroke-linecap="round"/><path d="M78 71q12 10 24 0" fill="none" stroke="#176b55" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="26" r="5" fill="#ffd66b" stroke="#172421" stroke-width="3"/><g class="horn"><path d="M37 61h13l25-14v43L50 76H37Z" fill="#ffd66b" stroke="#172421" stroke-width="4" stroke-linejoin="round"/><path d="M50 76l5 18H43l-6-18" fill="#ffad70" stroke="#172421" stroke-width="4" stroke-linejoin="round"/><path d="M31 61v16" stroke="#172421" stroke-width="4" stroke-linecap="round"/></g><g class="sound" fill="none" stroke="#176b55" stroke-width="3" stroke-linecap="round"><path d="M29 57q-8 10 0 20"/><path d="M22 51q-13 16 0 32"/></g><g class="pen"><path d="m128 89 20-26 8 6-20 26-11 5Z" fill="#6f82ef" stroke="#172421" stroke-width="3" stroke-linejoin="round"/><path d="m125 100 11-5-8-6Z" fill="#ffd66b" stroke="#172421" stroke-width="2"/><path d="M143 66l5-6 8 6-5 6" fill="#ffad70" stroke="#172421" stroke-width="2"/></g><path d="M137 106h22" stroke="#176b55" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" values="9;0;9" dur="2.8s" repeatCount="indefinite"/></path></g></svg>